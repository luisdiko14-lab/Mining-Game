name: BlockCraft Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic release version (for example 1.0.0)"
        required: true
        default: "4.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Windows installers and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          TAG_VERSION: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION
          } else {
            $version = $env:TAG_VERSION.TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Invalid release version: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Generate original assets and game icon
        shell: pwsh
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/generate_icon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/gen_textures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        run: dotnet restore BlockCraft.sln

      - name: Build
        run: dotnet build BlockCraft.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BlockCraft.sln --configuration Release --no-build --logger "trx;LogFileName=blockcraft-tests.trx"

      - name: Publish portable win-x64 package
        shell: pwsh
        run: .\scripts\package.ps1 -Version "${{ steps.version.outputs.value }}" -RuntimeIdentifier "win-x64"

      - name: Install Inno Setup and WiX Toolset v5
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          dotnet tool install --global wix --version 5.0.2
          wix --version

      - name: Build setup.exe with Inno Setup
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $compiler) { throw "Inno Setup compiler ISCC.exe was not found." }
          & $compiler.FullName "/DMyAppVersion=${{ steps.version.outputs.value }}" ".\installer\BlockCraft.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build setup.msi with WiX Toolset v5
        shell: pwsh
        run: |
          $publish = (Resolve-Path ".\artifacts\publish\win-x64").Path
          $msi = Join-Path (Resolve-Path ".\artifacts\installer").Path "BlockCraft-${{ steps.version.outputs.value }}-win-x64-setup.msi"
          wix build ".\installer\Product.wxs" -arch x64 -d "ProductVersion=${{ steps.version.outputs.value }}" -d "PublishDir=$publish" -o $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            ".\artifacts\BlockCraft-${{ steps.version.outputs.value }}-win-x64-portable.zip",
            ".\artifacts\installer\BlockCraft-${{ steps.version.outputs.value }}-win-x64-setup.exe",
            ".\artifacts\installer\BlockCraft-${{ steps.version.outputs.value }}-win-x64-setup.msi"
          )
          $lines = foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Expected release file missing: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content ".\artifacts\SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BlockCraft ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            artifacts/BlockCraft-${{ steps.version.outputs.value }}-win-x64-portable.zip
            artifacts/installer/BlockCraft-${{ steps.version.outputs.value }}-win-x64-setup.exe
            artifacts/installer/BlockCraft-${{ steps.version.outputs.value }}-win-x64-setup.msi
            artifacts/SHA256SUMS.txt
